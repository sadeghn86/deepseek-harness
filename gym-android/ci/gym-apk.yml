name: Gym Manager APK

# ساخت APK برنامهٔ آفلاین «مدیریت باشگاه».
#
# سندباکس توسعه نه JDK دارد نه Android SDK و دسترسی‌اش به dl.google.com و
# Maven Central بسته است، پس بیلد روی رانر گیت‌هاب انجام می‌شود؛ آنجا همه‌چیز
# در دسترس است. خروجی هم به‌صورت artifact و هم به‌صورت یک prerelease با
# لینک مستقیم APK منتشر می‌شود.

on:
  push:
    branches:
      - 'arena/**'
      - 'master'
    paths:
      - 'gym-android/**'
      - 'gym-android/ci/gym-apk.yml'
      - '.github/workflows/gym-apk.yml'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'APK به‌عنوان prerelease منتشر شود'
        type: boolean
        required: false
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install the SDK packages this build needs
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      # رانر Gradle دارد، ولی نسخه را پین می‌کنیم تا بیلد تکرارپذیر باشد.
      # مخزن عمداً gradle-wrapper.jar را نگه نمی‌دارد (باینری در درخت کد نیست).
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Unit tests (تاریخ شمسی و منطق یادآوری)
        working-directory: gym-android
        run: gradle --no-daemon testDebugUnitTest

      - name: Build the APKs
        working-directory: gym-android
        run: gradle --no-daemon assembleDebug assembleRelease

      - name: Collect the APKs
        id: collect
        run: |
          mkdir -p dist
          cp gym-android/app/build/outputs/apk/debug/app-debug.apk   dist/gym-manager-debug.apk
          cp gym-android/app/build/outputs/apk/release/app-release.apk dist/gym-manager-release.apk
          ls -lh dist/
          {
            echo "sha_debug=$(sha256sum dist/gym-manager-debug.apk | cut -d' ' -f1)"
            echo "sha_release=$(sha256sum dist/gym-manager-release.apk | cut -d' ' -f1)"
            echo "size=$(du -h dist/gym-manager-release.apk | cut -f1)"
          } >> "$GITHUB_OUTPUT"

      - name: Upload the APKs as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gym-manager-apk
          path: dist/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Publish a prerelease
        # برای push روی شاخه‌ها همیشه منتشر می‌شود تا کاربر لینک مستقیم داشته
        # باشد؛ در حالت دستی با ورودی publish_release کنترل می‌شود.
        if: ${{ github.event_name == 'push' || inputs.publish_release != false }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="gym-apk-$(date -u +%Y%m%d-%H%M%S)"
          gh release create "$TAG" dist/*.apk \
            --title "مدیریت باشگاه — APK ($TAG)" \
            --prerelease \
            --notes "$(cat <<EOF
          برنامهٔ کاملاً آفلاین مدیریت اعضای باشگاه.

          - \`gym-manager-release.apk\` — نسخهٔ نصب (side-loading باید روشن باشد)
          - \`gym-manager-debug.apk\` — نسخهٔ دیباگ
          - اندازه: ${{ steps.collect.outputs.size }}

          SHA-256
          - release: \`${{ steps.collect.outputs.sha_release }}\`
          - debug: \`${{ steps.collect.outputs.sha_debug }}\`

          هر دو APK با کلید دیباگ اندروید امضا شده‌اند؛ برای نصب شخصی مناسب‌اند
          و برای انتشار در فروشگاه نیستند.
          EOF
          )"
